name: Auto Deploy Hermes Agent (Docker Mode)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server via Docker
    runs-on: ubuntu-latest
    steps:
      - name: Execute Docker Deployment via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          EXCITECH_GATEWAY_API_KEY: ${{ secrets.EXCITECH_GATEWAY_API_KEY }}
          EXCITECH_GATEWAY_API_URL: ${{ secrets.EXCITECH_GATEWAY_API_URL }}
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
          REPLIZ_ACCESS_KEY: ${{ secrets.REPLIZ_ACCESS_KEY }}
          REPLIZ_SECRET_KEY: ${{ secrets.REPLIZ_SECRET_KEY }}
          REPLIZ_BASE_URL: ${{ secrets.REPLIZ_BASE_URL }}
          REPLIZ_APPROVAL_SIGNING_KEY: ${{ secrets.REPLIZ_APPROVAL_SIGNING_KEY }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || '22' }}
          command_timeout: 15m
          envs: EXCITECH_GATEWAY_API_KEY,EXCITECH_GATEWAY_API_URL,HERMES_DASHBOARD_BASIC_AUTH_USERNAME,HERMES_DASHBOARD_BASIC_AUTH_PASSWORD,REPLIZ_ACCESS_KEY,REPLIZ_SECRET_KEY,REPLIZ_BASE_URL,REPLIZ_APPROVAL_SIGNING_KEY
          script: |
            set -e
            echo "🚀 Starting Hermes Agent Auto-Deployment (Docker Mode)..."

            PROJECT_DIR="/home/ubuntu/app/hermes-agent"
            if [ -d "$PROJECT_DIR" ]; then
              cd "$PROJECT_DIR"
            else
              echo "⚠️ Directory $PROJECT_DIR not found, using current directory..."
            fi

            echo "📦 1. Stashing local custom changes..."
            git stash save "Auto-stash before deployment $(date +'%Y-%m-%d %H:%M:%S')" || true

            echo "🔄 2. Fetching & Pulling latest code from main branch..."
            git fetch origin main
            git merge origin/main --no-edit || git rebase origin/main

            echo "🧩 3. Restoring local custom changes..."
            git stash pop || true

            # Prefer GitHub Actions secrets. When they are not configured,
            # unset the empty forwarded values so Docker Compose can fall back
            # to PROJECT_DIR/.env on deployments that manage secrets on-host.
            if [ -z "${EXCITECH_GATEWAY_API_KEY:-}" ]; then
              unset EXCITECH_GATEWAY_API_KEY
            fi
            if [ -z "${EXCITECH_GATEWAY_API_URL:-}" ]; then
              unset EXCITECH_GATEWAY_API_URL
            fi
            if [ -z "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}" ]; then
              unset HERMES_DASHBOARD_BASIC_AUTH_USERNAME
            fi
            if [ -z "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}" ]; then
              unset HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
            fi
            if [ -z "${REPLIZ_ACCESS_KEY:-}" ]; then
              unset REPLIZ_ACCESS_KEY
            fi
            if [ -z "${REPLIZ_SECRET_KEY:-}" ]; then
              unset REPLIZ_SECRET_KEY
            fi
            if [ -z "${REPLIZ_BASE_URL:-}" ]; then
              unset REPLIZ_BASE_URL
            fi
            if [ -z "${REPLIZ_APPROVAL_SIGNING_KEY:-}" ]; then
              unset REPLIZ_APPROVAL_SIGNING_KEY
            fi

            # docker compose also reads PROJECT_DIR/.env. Do not print or
            # source that file: it may contain unrelated production secrets.
            # This check only confirms that one of the two supported secret
            # sources contains a non-empty Excitech key.
            if [ -z "${EXCITECH_GATEWAY_API_KEY:-}" ] && \
               ! grep -Eq '^EXCITECH_GATEWAY_API_KEY=.+$' .env 2>/dev/null; then
              echo "❌ Missing EXCITECH_GATEWAY_API_KEY. Configure the GitHub Actions secret or PROJECT_DIR/.env on the VPS."
              exit 1
            fi

            if [ -z "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:-}" ] && \
               ! grep -Eq '^HERMES_DASHBOARD_BASIC_AUTH_USERNAME=.+$' .env 2>/dev/null; then
              echo "❌ Missing HERMES_DASHBOARD_BASIC_AUTH_USERNAME. Configure the GitHub Actions secret or PROJECT_DIR/.env on the VPS."
              exit 1
            fi

            if [ -z "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}" ] && \
               ! grep -Eq '^HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=.+$' .env 2>/dev/null; then
              echo "❌ Missing HERMES_DASHBOARD_BASIC_AUTH_PASSWORD. Configure the GitHub Actions secret or PROJECT_DIR/.env on the VPS."
              exit 1
            fi

            echo "🧹 4. Stopping the previous Compose deployment and removing orphans..."
            sudo docker compose down --remove-orphans

            echo "🐳 5. Deploying Docker Containers (gateway & dashboard)..."
            HERMES_UID=$(id -u) HERMES_GID=$(id -g) sudo -E docker compose up -d --build --force-recreate --remove-orphans

            echo "📊 6. Checking active Docker containers..."
            sudo docker ps | grep -i hermes || true

            echo "🔐 7. Verifying container roles and runtime credentials..."
            sudo docker exec hermes sh -lc 'test "$HERMES_DASHBOARD" = "0"'
            sudo docker exec hermes-dashboard sh -lc 'test "$HERMES_DASHBOARD" = "0"'
            sudo docker exec hermes sh -lc 'test -n "$EXCITECH_GATEWAY_API_KEY"'
            sudo docker exec hermes-dashboard sh -lc 'test -n "$EXCITECH_GATEWAY_API_KEY"'
            sudo docker exec hermes-dashboard sh -lc 'test -n "$HERMES_DASHBOARD_BASIC_AUTH_USERNAME"'
            sudo docker exec hermes-dashboard sh -lc 'test -n "$HERMES_DASHBOARD_BASIC_AUTH_PASSWORD"'

            echo "🩺 8. Waiting for the password-gated dashboard..."
            DASHBOARD_READY=0
            for attempt in $(seq 1 30); do
              DASHBOARD_STATUS=$(sudo docker exec hermes-dashboard sh -lc \
                'curl -fsS http://127.0.0.1:9119/api/status' 2>/dev/null || true)
              if printf '%s' "$DASHBOARD_STATUS" \
                   | grep -Eq '"auth_required"[[:space:]]*:[[:space:]]*true' && \
                 printf '%s' "$DASHBOARD_STATUS" \
                   | grep -Eq '"auth_providers"[[:space:]]*:[[:space:]]*\[[^]]*"basic"'; then
                DASHBOARD_READY=1
                break
              fi
              sleep 2
            done

            if [ "$DASHBOARD_READY" -ne 1 ]; then
              echo "❌ Dashboard did not become ready with authentication enabled."
              sudo docker logs --tail 120 hermes-dashboard || true
              exit 1
            fi

            echo "✅ Deployment complete! Hermes Agent running safely in Docker."
